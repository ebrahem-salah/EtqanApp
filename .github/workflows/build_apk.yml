name: Build Etqan Android APK (تجميع تطبيق إتقان أندرويد)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب كود المشروع
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا JDK 17
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. إعداد فلاتر 3.27.4 المستقرة
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      # 4. تثبيت المكتبات
      - name: Install Dependencies
        run: flutter pub get

      # 5. تهيئة بيئة أندرويد وتوليد مفتاح التوقيع الرسمي Release Keystore
      - name: Configure Android & Generate Keystore
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          chmod +x android/gradlew
          
          # إنشاء مفتاح توقيع رسمي مشفر للإنتاج
          keytool -genkey -v -keystore android/app/etqan-release.jks \
            -alias etqan -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass etqan2026 -keypass etqan2026 \
            -dname "CN=Etqan App, OU=Engineering, O=Etqan, L=Riyadh, C=SA"
          
          # إنشاء ملف key.properties لربط Gradle بالمفتاح
          cat <<EOF > android/key.properties
          storePassword=etqan2026
          keyPassword=etqan2026
          keyAlias=etqan
          storeFile=etqan-release.jks
          EOF

      # 6. بناء ملف APK النهائي الجاهز للتثبيت
      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      # 7. رفع ملف الـ APK لتتمكن من تنزيله مباشرة
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: etqan-app-release
          path: build/app/outputs/flutter-apk/*.apk
