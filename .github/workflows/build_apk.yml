name: Build Etqan Android APK (تجميع تطبيق إتقان أندرويد)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب كود المشروع
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا JDK 17
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. إعداد فلاتر 3.24.5 المستقرة
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      # 4. توليد هيكل أندرويد الرسمي وتثبيت المكتبات
      - name: Scaffold Android & Install Dependencies
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml || true
          flutter create --project-name etqan . --platforms=android --org com.etqan
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml || true
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4G" >> android/gradle.properties
          flutter pub get

      # 5. بناء ملف APK النهائي الجاهز للتثبيت
      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      # 6. رفع ملف الـ APK لتتمكن من تنزيله مباشرة
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: etqan-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
