name: Build Etqan Android APK (تجميع تطبيق إتقان أندرويد)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب كود المشروع
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا JDK 17
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. إعداد فلاتر في السحاب
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      # 4. تثبيت الحزم والمكتبات
      - name: Install Dependencies
        run: flutter pub get

      # 5. تهيئة بيئة أندرويد وتوليد Gradle Wrapper
      - name: Configure Android Environment & Generate Wrapper
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          cd android
          gradle wrapper --gradle-version 8.3 || true
          chmod +x gradlew || true

      # 6. بناء ملف APK النهائي الجاهز للتثبيت
      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      # 7. رفع ملف الـ APK لتتمكن من تنزيله مباشرة
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: etqan-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
