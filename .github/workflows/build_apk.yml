name: Build Etqan Android APK (تجميع تطبيق إتقان أندرويد)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب كود المشروع
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا JDK 17
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. إعداد أحدث إصدار فلاتر المستقرة
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. تثبيت المكتبات
      - name: Install Dependencies
        run: flutter pub get

      # 5. تهيئة بيئة أندرويد
      - name: Configure Android
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          chmod +x android/gradlew

      # 6. بناء ملف APK النهائي الجاهز للتثبيت
      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      # 7. رفع ملف الـ APK لتتمكن من تنزيله مباشرة
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: etqan-app-release
          path: build/app/outputs/flutter-apk/*.apk
