name: Build Etqan Android & iOS (تجميع تطبيق إتقان لمتجري جوجل بلاي وآبل)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب كود المشروع
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # 2. إعداد بيئة جافا JDK 17
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. إعداد فلاتر 3.27.4 المستقرة
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      # 4. تثبيت وتوليد بنية iOS الرسمية لمتجر آبل
      - name: Setup & Configure iOS Project
        run: |
          if [ ! -d "ios" ]; then
            flutter create . --platforms=ios --org com.etqan
            python3 tools/configure_ios.py
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add ios/
            git commit -m "chore(ios): scaffold complete iOS project structure with App Store privacy descriptions" || true
            git push origin HEAD:main || true
          fi

      # 5. تثبيت المكتبات
      - name: Install Dependencies
        run: flutter pub get

      # 6. توليد أيقونات التطبيق الرسمية لكافة الشاشات وشاشة البداية
      - name: Generate App Icons & Native Splash Screen
        run: |
          dart run flutter_launcher_icons || true
          dart run flutter_native_splash:create || true

      # 7. تهيئة بيئة أندرويد وتوليد مفتاح التوقيع الرسمي Release Keystore
      - name: Configure Android & Generate Keystore
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          chmod +x android/gradlew
          
          # إنشاء مفتاح توقيع رسمي مشفر للإنتاج
          keytool -genkey -v -keystore android/app/etqan-release.jks \
            -alias etqan -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass etqan2026 -keypass etqan2026 \
            -dname "CN=Etqan App, OU=Engineering, O=Etqan, L=Riyadh, C=SA"
          
          # إنشاء ملف key.properties لربط Gradle بالمفتاح
          cat <<EOF > android/key.properties
          storePassword=etqan2026
          keyPassword=etqan2026
          keyAlias=etqan
          storeFile=etqan-release.jks
          EOF

      # 8. بناء ملف APK للتثبيت المباشر على الأجهزة
      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      # 9. بناء حزمة Android App Bundle (.aab) الرسمية لمتجر Google Play
      - name: Build Google Play App Bundle (AAB)
        run: flutter build appbundle --release --no-tree-shake-icons

      # 10. رفع ملف APK كـ Artifact للتثبيت المباشر
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: etqan-app-release
          path: build/app/outputs/flutter-apk/*.apk

      # 11. رفع حزمة Google Play (.aab) كـ Artifact للرفع المباشر على Google Play Console
      - name: Upload Google Play AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: etqan-google-play-aab
          path: build/app/outputs/bundle/release/*.aab
