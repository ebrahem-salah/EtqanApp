name: etqan
description: "تطبيق إتقان لتعليم وتحفيظ القرآن الكريم والسنة النبوية والمقارئ الإلكترونية"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: '>=0.19.0 <=0.21.0'
  supabase_flutter: ^2.8.0
  flutter_svg: ^2.0.10+1
  dio: ^5.7.0
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  cached_network_image: ^3.4.1
  lottie: ^3.1.2
  video_player: ^2.9.2
  audioplayers: ^6.0.0
  crypto: ^3.0.3
  cupertino_icons: ^1.0.8
  zego_express_engine: ^3.25.0
  flutter_local_notifications: ^17.2.2
  connectivity_plus: ^6.1.0
  file_picker: ^8.1.2
  video_compress: ^3.1.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F5B46"
  adaptive_icon_foreground: "assets/logo/logo.png"

flutter_native_splash:
  color: "#0F5B46"
  image: "assets/logo/logo.png"
  color_dark: "#0F5B46"
  image_dark: "assets/logo/logo.png"
  android_12:
    color: "#0F5B46"
    image: "assets/logo/logo.png"
  ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/svgs/
    - assets/animation/
    - assets/logo/
    - assets/videos/
    - assets/translations/
    - assets/payment/
    - assets/data/

  fonts:
    - family: Dubai
      fonts:
        - asset: assets/fonts/Dubai-Regular.ttf
        - asset: assets/fonts/Dubai-Medium.ttf
          weight: 500
        - asset: assets/fonts/Dubai-Bold.ttf
          weight: 700
        - asset: assets/fonts/Dubai-Light.ttf
          weight: 300
