# Google Cloud Build Configuration for Etqan Flutter App
steps:
  # 1. Use pre-built Docker image containing Flutter & Android SDK
  - name: 'ghcr.io/cirruslabs/flutter:latest'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        flutter pub get
        flutter build apk --release

# 2. Store the built APK in Google Cloud Storage bucket
artifacts:
  objects:
    location: 'gs://${_BUCKET_NAME}/etqan-release/'
    paths:
      - 'build/app/outputs/flutter-apk/app-release.apk'

options:
  machineType: 'E2_HIGHCPU_8'
